<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OW BAN ROOM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="landing-body">
  <main class="landing-shell">
    <section class="hero-panel">
      <div class="eyebrow">CUSTOM MATCH TOOL</div>
      <h1>OW BAN<br><span>ROOM</span></h1>
      <p class="lead">10人で投票して、7・5・3点からヒーローBANを決めるカスタム用Webツール。</p>
      <div class="rule-strip">
        <div><strong>7</strong><span>第1候補</span></div>
        <div><strong>5</strong><span>第2候補</span></div>
        <div><strong>3</strong><span>第3候補</span></div>
      </div>
    </section>

    <section class="entry-panel">
      <div class="entry-card">
        <p class="section-label">HOST</p>
        <h2>新しいルームを作る</h2>
        <p>ルームコードを発行して、両チームへ共有します。</p>
        <button id="create-room" class="primary-button">ルームを作成</button>
      </div>

      <div class="entry-card">
        <p class="section-label">JOIN</p>
        <h2>ルームへ参加</h2>
        <form id="join-room-form">
          <label for="room-code">6桁のルームコード</label>
          <input id="room-code" name="room-code" maxlength="6" autocomplete="off" placeholder="AB12CD" required>
          <button class="secondary-button" type="submit">参加画面を開く</button>
        </form>
      </div>
      <p id="landing-error" class="error-message" hidden></p>
    </section>
  </main>

  <script>
    const errorBox = document.getElementById('landing-error');
    document.getElementById('create-room').addEventListener('click', async () => {
      errorBox.hidden = true;
      const button = document.getElementById('create-room');
      button.disabled = true;
      button.textContent = '作成中…';
      try {
        const response = await fetch('/api/rooms', { method: 'POST' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'ルーム作成に失敗しました。');
        localStorage.setItem(`owban:${data.code}:host`, data.host_token);
        location.href = `/room/${data.code}`;
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.hidden = false;
        button.disabled = false;
        button.textContent = 'ルームを作成';
      }
    });

    document.getElementById('join-room-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const code = document.getElementById('room-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length !== 6) {
        errorBox.textContent = '6桁のルームコードを入力してください。';
        errorBox.hidden = false;
        return;
      }
      location.href = `/room/${code}`;
    });
  </script>
</body>
</html>
